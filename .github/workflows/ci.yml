name: CI

on:
  push:
    branches:
      - development
  pull_request:
  workflow_call:
    inputs:
      repository:
        default: desktop/desktop
        required: false
        type: string
      ref:
        required: true
        type: string
      upload-artifacts:
        default: false
        required: false
        type: boolean
      environment:
        type: string
        required: true
      sign:
        type: boolean
        default: true
        required: false
      error-reporting-endpoint:
        type: string
        required: false
      non-fatal-error-reporting-endpoint:
        type: string
        required: false
    secrets:
      AZURE_CODE_SIGNING_TENANT_ID:
      AZURE_CODE_SIGNING_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_SECRET:
      GATEWATCHER_APP_STORE_CONNECT_API_KEY_ID:
      GATEWATCHER_APP_STORE_CONNECT_API_ISSUER_ID:
      GATEWATCHER_APP_STORE_CONNECT_API_BASE64_PRIVATE_KEY:
      APPLE_APPLICATION_CERT:
      APPLE_APPLICATION_CERT_PASSWORD:

env:
  NODE_VERSION: 24.22.0
  DESKTOP_ERROR_REPORTING_ENDPOINT: ${{ inputs.error-reporting-endpoint }}
  DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT:
    ${{ inputs.non-fatal-error-reporting-endpoint }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn
      - run: yarn validate-electron-version
      - run: yarn lint
      - run: yarn validate-changelog
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code
  build:
    name: ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
        arch: [x64, arm64]
        include:
          - os: macos-latest
            friendlyName: macOS
          - os: windows-2022
            friendlyName: Windows
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
      DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      # Fork pushes have no Apple or Azure certificates. Signed workflow_call
      # deployments keep the official signing path.
      DESKTOP_SKIP_CODE_SIGNING:
        ${{ github.event_name == 'workflow_call' && inputs.sign && '0' || '1' }}
      DESKTOP_SKIP_DELTA:
        ${{ github.event_name == 'workflow_call' && inputs.sign && '0' || '1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
      - name: Validate macOS version
        if: runner.os == 'macOS'
        run: yarn validate-macos-version
      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          yarn install
          yarn test
      - name: Validate notarization API-key secrets
        if:
          runner.os == 'macOS' && contains(fromJSON('["production", "beta",
          "test"]'), inputs.environment)
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_BASE64_PRIVATE_KEY }}
        run: |
          if [[ -z "$API_KEY_ID" || -z "$API_ISSUER_ID" || -z "$API_PRIVATE_KEY" ]]; then
            echo "::error::Set all three GATEWATCHER_APP_STORE_CONNECT_API secrets together for macOS release notarization."
            exit 1
          fi
      - name: Set up notarization API key
        if:
          runner.os == 'macOS' && contains(fromJSON('["production", "beta",
          "test"]'), inputs.environment)
        id: notarization-key
        uses: nodeselector/setup-apple-codesign@6b2173bdcb7dd4057e0396ccfa28ebfa4d90affa
        with:
          asset-type: app-store-connect-api-key
          app-store-connect-api-key-key-id:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_KEY_ID }}
          app-store-connect-api-key-issuer-id:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_ISSUER_ID }}
          app-store-connect-api-key-base64-private-key:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_BASE64_PRIVATE_KEY }}
      - name: Set release version
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/development'
        shell: bash
        run: |
          base=$(node -p "require('./app/package.json').version")
          echo "DESKTOP_APP_VERSION=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Release version ${base}.${GITHUB_RUN_NUMBER}"
      - name: Build production app
        id: compile
        run: yarn build:prod
        env:
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          APPLE_API_KEY_PATH:
            ${{
            steps.notarization-key.outputs.app-store-connect-api-key-key-path }}
          APPLE_API_KEY_ID:
            ${{ steps.notarization-key.outputs.app-store-connect-api-key-key-id
            }}
          APPLE_API_ISSUER:
            ${{
            steps.notarization-key.outputs.app-store-connect-api-key-issuer-id
            }}
          APPLE_APPLICATION_CERT: ${{ secrets.APPLE_APPLICATION_CERT }}
          KEY_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        id: test-setup
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Run unit tests
        if: |
          (runner.os == 'Windows' && matrix.arch == 'x64') || (runner.os == 'macOS' && matrix.arch == 'arm64')
        run: yarn test:unit
      - name: Run script tests
        run: yarn test:script
      - if:
          ${{ !cancelled() && runner.os == 'Windows' && steps.compile.outcome ==
          'success' }}
        uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        id: package
        if:
          ${{ !cancelled() && steps.compile.outcome == 'success' &&
          steps.test-setup.outcome == 'success' }}
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if:
          ${{ !cancelled() && steps.package.outcome == 'success' &&
          (github.event_name == 'push' || inputs.upload-artifacts) }}
        with:
          name: ${{matrix.friendlyName}}-${{matrix.arch}}
          path: |
            dist/GitHub Desktop-${{matrix.arch}}.zip
            dist/GitHubDesktop-*.nupkg
            dist/GitHubDesktopSetup-${{matrix.arch}}.exe
            dist/GitHubDesktopSetup-${{matrix.arch}}.msi
            dist/bundle-size.json
            dist/bundle-hash.json
          if-no-files-found: error
  e2e-smoke:
    name: E2E Smoke ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            friendlyName: macOS
            arch: arm64
          - os: windows-2022
            friendlyName: Windows
            arch: x64
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
          install-ffmpeg: 'true'
      - name: Validate notarization API-key secrets
        if:
          runner.os == 'macOS' && contains(fromJSON('["production", "beta",
          "test"]'), inputs.environment)
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_BASE64_PRIVATE_KEY }}
        run: |
          if [[ -z "$API_KEY_ID" || -z "$API_ISSUER_ID" || -z "$API_PRIVATE_KEY" ]]; then
            echo "::error::Set all three GATEWATCHER_APP_STORE_CONNECT_API secrets together for macOS release notarization."
            exit 1
          fi
      - name: Set up notarization API key
        if:
          runner.os == 'macOS' && contains(fromJSON('["production", "beta",
          "test"]'), inputs.environment)
        id: notarization-key
        uses: nodeselector/setup-apple-codesign@6b2173bdcb7dd4057e0396ccfa28ebfa4d90affa
        with:
          asset-type: app-store-connect-api-key
          app-store-connect-api-key-key-id:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_KEY_ID }}
          app-store-connect-api-key-issuer-id:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_ISSUER_ID }}
          app-store-connect-api-key-base64-private-key:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_BASE64_PRIVATE_KEY }}
      - name: Build production app
        run: yarn build:prod
        env:
          DESKTOP_E2E_UPDATES_URL: http://127.0.0.1:51789/update
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          APPLE_API_KEY_PATH:
            ${{
            steps.notarization-key.outputs.app-store-connect-api-key-key-path }}
          APPLE_API_KEY_ID:
            ${{ steps.notarization-key.outputs.app-store-connect-api-key-key-id
            }}
          APPLE_API_ISSUER:
            ${{
            steps.notarization-key.outputs.app-store-connect-api-key-issuer-id
            }}
          APPLE_APPLICATION_CERT: ${{ secrets.APPLE_APPLICATION_CERT }}
          KEY_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Install app on macOS
        if: runner.os == 'macOS'
        run: |
          rm -rf "/Applications/GitHub Desktop.app"
          ditto "dist/GitHub Desktop-darwin-arm64/GitHub Desktop.app" "/Applications/GitHub Desktop.app"
          echo "DESKTOP_E2E_APP_PATH=/Applications/GitHub Desktop.app/Contents/MacOS/GitHub Desktop" >> "$GITHUB_ENV"
      - name: Install app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Write-SquirrelLogs {
            $logPaths = @(
              "$env:LOCALAPPDATA\SquirrelSetup.log",
              "$env:LOCALAPPDATA\GitHubDesktop\SquirrelSetup.log"
            )

            foreach ($logPath in $logPaths) {
              if (Test-Path $logPath) {
                Write-Host "Showing log: $logPath"
                Get-Content $logPath -Tail 200
              }
            }
          }

          $setupExe = "dist/GitHubDesktopSetup-${{ matrix.arch }}.exe"
          $installer = Start-Process -FilePath $setupExe -ArgumentList "/S" -PassThru

          try {
            Wait-Process -Id $installer.Id -Timeout 300 -ErrorAction Stop
          } catch {
            Write-SquirrelLogs
            throw "Windows installer timed out after 300 seconds"
          }

          Get-Process GitHubDesktop -ErrorAction SilentlyContinue | Stop-Process -Force

          $installedExe = $null
          for ($attempt = 0; $attempt -lt 30 -and -not $installedExe; $attempt++) {
            $installedExe = Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop\app-*\GitHubDesktop.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $installedExe) {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $installedExe) {
            Write-SquirrelLogs
            throw "Unable to locate installed GitHub Desktop executable"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "DESKTOP_E2E_APP_PATH=$installedExe"
      - name: Run packaged E2E smoke tests
        run: yarn test:e2e:run:packaged
      - name: Upload E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{matrix.friendlyName}}-${{matrix.arch}}
          path: playwright-videos/**
          if-no-files-found: warn
  publish:
    name: Publish GitHub Release
    needs: build
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref ==
      'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./app/package.json').version")
          version="${base}.${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '{macOS,Windows}-*'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          mapfile -t files < <(find release-assets -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.msi' -o -name '*.nupkg' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No macOS or Windows installers were produced."
            exit 1
          fi

          zip_count=$(printf '%s\n' "${files[@]}" | grep -c '\.zip$' || true)
          exe_count=$(printf '%s\n' "${files[@]}" | grep -c 'Setup-.*\.exe$' || true)
          if [ "$zip_count" -lt 1 ] || [ "$exe_count" -lt 1 ]; then
            echo "::error::Need at least one macOS zip and one Windows setup exe. Found ${zip_count} zip(s) and ${exe_count} setup exe(s)."
            exit 1
          fi

          cat > release-notes.md <<EOF
          自动构建 \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\`

          - macOS：下载 \`GitHub Desktop-<arch>.zip\`，解压后把 GitHub Desktop.app 放进“应用程序”
          - Windows：下载 \`GitHubDesktopSetup-<arch>.exe\` 并运行

          Desktop-Update-Sha: ${GITHUB_SHA}
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "GitHub Desktop ${VERSION}" \
              --notes-file release-notes.md \
              --latest
          fi
